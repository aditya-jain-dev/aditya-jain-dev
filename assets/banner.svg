<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" width="1000" height="220" role="img" aria-label="Aditya Jain — Full-Stack Engineer, SaaS Architect, Systems Builder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F2027"/>
      <stop offset="50%" stop-color="#203A43"/>
      <stop offset="100%" stop-color="#2C5364"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00D9FF"/>
      <stop offset="100%" stop-color="#6D4AFF"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#00D9FF" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#00D9FF" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clip"><rect width="1000" height="220" rx="10"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1000" height="220" fill="url(#bg)"/>
    <ellipse cx="820" cy="40" rx="320" ry="180" fill="url(#glow)"/>

    <!-- subtle grid -->
    <g stroke="#00D9FF" stroke-opacity="0.06" stroke-width="1">
      <path d="M0 55h1000M0 110h1000M0 165h1000"/>
      <path d="M125 0v220M250 0v220M375 0v220M500 0v220M625 0v220M750 0v220M875 0v220"/>
    </g>

    <!-- drifting wave -->
    <g opacity="0.5">
      <path d="M-1000 172 q125 -26 250 0 t250 0 t250 0 t250 0 t250 0 t250 0 t250 0 t250 0 V220 H-1000 Z" fill="#00D9FF" fill-opacity="0.10">
        <animateTransform attributeName="transform" type="translate" from="0 0" to="1000 0" dur="14s" repeatCount="indefinite"/>
      </path>
      <path d="M-1000 188 q125 22 250 0 t250 0 t250 0 t250 0 t250 0 t250 0 t250 0 t250 0 V220 H-1000 Z" fill="#6D4AFF" fill-opacity="0.12">
        <animateTransform attributeName="transform" type="translate" from="0 0" to="1000 0" dur="20s" repeatCount="indefinite"/>
      </path>
    </g>

    <text x="500" y="98" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="62" font-weight="700" fill="#ffffff" letter-spacing="1">Aditya Jain</text>
    <rect x="410" y="118" width="180" height="3" rx="1.5" fill="url(#accent)"/>
    <text x="500" y="150" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#9FE9FF" letter-spacing="2.5">FULL-STACK ENGINEER  •  SaaS ARCHITECT  •  SYSTEMS BUILDER</text>
  </g>
</svg>
